<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="经典的2048益智游戏">
    <meta name="theme-color" content="#bbada0">
    <link rel="manifest" href="manifest.json">
    <title>2048 游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #faf8ef;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            text-align: center;
            max-width: 500px;
            width: 100%;
        }

        .header {
            margin-bottom: 20px;
        }

        .title {
            font-size: 80px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 10px;
        }

        .score-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .score-box {
            background-color: #bbada0;
            padding: 15px 25px;
            border-radius: 5px;
            color: white;
            font-weight: bold;
        }

        .score-label {
            font-size: 14px;
            text-transform: uppercase;
            display: block;
        }

        .score-value {
            font-size: 24px;
            display: block;
        }

        .controls {
            margin-bottom: 20px;
        }

        .btn {
            background-color: #8f7a66;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #9f8a76;
        }

        .game-container {
            background-color: #bbada0;
            border-radius: 10px;
            padding: 10px;
            position: relative;
            margin: 0 auto;
            width: fit-content;
            touch-action: none; /* 防止浏览器默认触摸行为 */
            user-select: none; /* 防止文本选择 */
            -webkit-user-select: none;
        }

        .game-grid {
            display: grid;
            grid-template-columns: repeat(4, 100px);
            grid-template-rows: repeat(4, 100px);
            gap: 10px;
        }

        .grid-cell {
            background-color: #cdc1b4;
            border-radius: 5px;
            width: 100px;
            height: 100px;
        }

        .tile {
            width: 100px;
            height: 100px;
            background-color: #eee4da;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            font-weight: bold;
            color: #776e65;
            transition: none;
            z-index: 10;
        }

        .tile-2 { background-color: #eee4da; color: #776e65; }
        .tile-4 { background-color: #ede0c8; color: #776e65; }
        .tile-8 { background-color: #f2b179; color: #f9f6f2; }
        .tile-16 { background-color: #f59563; color: #f9f6f2; }
        .tile-32 { background-color: #f67c5f; color: #f9f6f2; }
        .tile-64 { background-color: #f65e3b; color: #f9f6f2; }
        .tile-128 { background-color: #edcf72; color: #f9f6f2; font-size: 28px; }
        .tile-256 { background-color: #edcc61; color: #f9f6f2; font-size: 28px; }
        .tile-512 { background-color: #edc850; color: #f9f6f2; font-size: 28px; }
        .tile-1024 { background-color: #edc53f; color: #f9f6f2; font-size: 24px; }
        .tile-2048 { background-color: #edc22e; color: #f9f6f2; font-size: 24px; }

        @media (max-width: 520px) {
            .tile {
                width: 70px;
                height: 70px;
            }
        }

        .game-message {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(238, 228, 218, 0.73);
            border-radius: 10px;
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
        }

        .game-message.show {
            display: flex;
        }

        .game-message p {
            font-size: 48px;
            font-weight: bold;
            color: #776e65;
            margin-bottom: 20px;
        }

        .instructions {
            margin-top: 20px;
            color: #776e65;
            line-height: 1.5;
        }

        .instructions h3 {
            margin-bottom: 10px;
        }

        @media (max-width: 520px) {
            .title {
                font-size: 60px;
            }

            .game-grid {
                grid-template-columns: repeat(4, 70px);
                grid-template-rows: repeat(4, 70px);
                gap: 7px;
            }

            .grid-cell {
                width: 70px;
                height: 70px;
            }

            .tile {
                width: 70px;
                height: 70px;
                font-size: 24px;
            }

            .tile-128, .tile-256, .tile-512 {
                font-size: 20px;
            }

            .tile-1024, .tile-2048 {
                font-size: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">2048</div>
            <div class="score-container">
                <div class="score-box">
                    <span class="score-label">分数</span>
                    <span class="score-value" id="score">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">最高分</span>
                    <span class="score-value" id="best-score">0</span>
                </div>
            </div>
            <div class="controls">
                <button class="btn" id="new-game-btn">新游戏</button>
            </div>
        </div>

        <div class="game-container">
            <div class="game-grid">
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
                <div class="grid-cell"></div>
            </div>
            <div class="game-message" id="game-message">
                <p id="message-text"></p>
                <button class="btn" id="try-again-btn">再试一次</button>
            </div>
        </div>

        <div class="instructions">
            <h3>游戏说明</h3>
            <p>使用键盘方向键（↑ ↓ ← →）移动方块。</p>
            <p>相同数字的方块碰撞时会合并成它们的和。</p>
            <p>目标是合并出2048方块！</p>
        </div>
    </div>

    <script>
        class Game2048 {
            constructor() {
                this.size = 4;
                this.board = [];
                this.score = 0;
                this.bestScore = localStorage.getItem('bestScore') || 0;
                this.won = false;
                this.over = false;
                
                this.init();
                this.setupEventListeners();
            }

            init() {
                // 初始化游戏网格结构
                const gameGrid = document.querySelector('.game-grid');
                gameGrid.innerHTML = '';
                
                // 创建16个网格单元
                for (let i = 0; i < this.size * this.size; i++) {
                    const gridCell = document.createElement('div');
                    gridCell.className = 'grid-cell';
                    gameGrid.appendChild(gridCell);
                }
                
                this.board = Array(this.size).fill().map(() => Array(this.size).fill(0));
                this.score = 0;
                this.won = false;
                this.over = false;
                this.updateScore();
                
                // 添加两个初始方块
                this.addRandomTile();
                this.addRandomTile();
                this.render();
            }

            addRandomTile() {
                const emptyCells = [];
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.board[i][j] === 0) {
                            emptyCells.push({x: i, y: j});
                        }
                    }
                }

                if (emptyCells.length > 0) {
                    const {x, y} = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    this.board[x][y] = Math.random() < 0.9 ? 2 : 4;
                    return {x, y};
                }
                return null;
            }

            move(direction) {
                if (this.over) return;

                let moved = false;
                const newBoard = this.board.map(row => [...row]);

                const rotateBoard = (board) => {
                    const size = board.length;
                    const rotated = Array(size).fill().map(() => Array(size).fill(0));
                    for (let i = 0; i < size; i++) {
                        for (let j = 0; j < size; j++) {
                            rotated[i][j] = board[size - 1 - j][i];
                        }
                    }
                    return rotated;
                };

                // 旋转board使得移动总是向左（顺时针旋转）
                let rotations = 0;
                let workingBoard = newBoard;
                
                if (direction === 'up') {
                    workingBoard = rotateBoard(rotateBoard(rotateBoard(workingBoard)));
                    rotations = 3;
                } else if (direction === 'right') {
                    workingBoard = rotateBoard(rotateBoard(workingBoard));
                    rotations = 2;
                } else if (direction === 'down') {
                    workingBoard = rotateBoard(workingBoard);
                    rotations = 1;
                }

                // 向左移动和合并
                for (let i = 0; i < this.size; i++) {
                    const row = workingBoard[i].filter(val => val !== 0);
                    
                    // 合并
                    for (let j = 0; j < row.length - 1; j++) {
                        if (row[j] === row[j + 1]) {
                            row[j] *= 2;
                            row.splice(j + 1, 1);
                            this.score += row[j];
                            moved = true;
                            
                            if (row[j] === 2048) {
                                this.won = true;
                            }
                        }
                    }

                    // 填充0
                    while (row.length < this.size) {
                        row.push(0);
                    }

                    // 检查是否移动
                    for (let j = 0; j < this.size; j++) {
                        if (workingBoard[i][j] !== row[j]) {
                            moved = true;
                        }
                        workingBoard[i][j] = row[j];
                    }
                }

                // 旋转回来
                for (let i = 0; i < (4 - rotations) % 4; i++) {
                    workingBoard = rotateBoard(workingBoard);
                }

                if (moved) {
                    this.board = workingBoard;
                    const newTile = this.addRandomTile();
                    this.render();
                    this.updateScore();
                    
                    // 检查游戏是否结束
                    if (this.checkGameOver()) {
                        this.over = true;
                        this.showMessage(this.won ? '你赢了！' : '游戏结束！');
                    } else if (this.won) {
                        this.showMessage('你赢了！');
                    }
                }
            }

            checkGameOver() {
                // 检查是否有空单元格
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.board[i][j] === 0) {
                            return false;
                        }
                    }
                }

                // 检查是否可以合并
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        const current = this.board[i][j];
                        if ((i < this.size - 1 && this.board[i + 1][j] === current) ||
                            (j < this.size - 1 && this.board[i][j + 1] === current)) {
                            return false;
                        }
                    }
                }

                return true;
            }

            render() {
                const gameGrid = document.querySelector('.game-grid');
                
                // 清空游戏网格
                gameGrid.innerHTML = '';

                // 根据当前board状态重新创建所有单元格
                for (let i = 0; i < this.size; i++) {
                    for (let j = 0; j < this.size; j++) {
                        if (this.board[i][j] !== 0) {
                            // 创建方块
                            const tile = document.createElement('div');
                            tile.className = `tile tile-${this.board[i][j]}`;
                            tile.textContent = this.board[i][j];
                            gameGrid.appendChild(tile);
                        } else {
                            // 创建空白网格单元
                            const emptyCell = document.createElement('div');
                            emptyCell.className = 'grid-cell';
                            gameGrid.appendChild(emptyCell);
                        }
                    }
                }
            }

            updateScore() {
                document.getElementById('score').textContent = this.score;
                if (this.score > this.bestScore) {
                    this.bestScore = this.score;
                    localStorage.setItem('bestScore', this.bestScore);
                }
                document.getElementById('best-score').textContent = this.bestScore;
            }

            showMessage(text) {
                const message = document.getElementById('game-message');
                const messageText = document.getElementById('message-text');
                messageText.textContent = text;
                message.classList.add('show');
            }

            hideMessage() {
                const message = document.getElementById('game-message');
                message.classList.remove('show');
            }

            setupEventListeners() {
                // 键盘控制
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowUp') {
                        e.preventDefault();
                        this.move('up');
                    } else if (e.key === 'ArrowDown') {
                        e.preventDefault();
                        this.move('down');
                    } else if (e.key === 'ArrowLeft') {
                        e.preventDefault();
                        this.move('left');
                    } else if (e.key === 'ArrowRight') {
                        e.preventDefault();
                        this.move('right');
                    }
                });

                // 触摸滑动控制
                const gameContainer = document.querySelector('.game-container');
                let touchStartX = 0;
                let touchStartY = 0;
                let touchEndX = 0;
                let touchEndY = 0;

                gameContainer.addEventListener('touchstart', (e) => {
                    touchStartX = e.changedTouches[0].screenX;
                    touchStartY = e.changedTouches[0].screenY;
                }, { passive: true });

                gameContainer.addEventListener('touchend', (e) => {
                    touchEndX = e.changedTouches[0].screenX;
                    touchEndY = e.changedTouches[0].screenY;
                    this.handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
                }, { passive: true });

                // 鼠标拖拽控制（用于电脑测试）
                let mouseDown = false;
                let mouseStartX = 0;
                let mouseStartY = 0;

                gameContainer.addEventListener('mousedown', (e) => {
                    mouseDown = true;
                    mouseStartX = e.screenX;
                    mouseStartY = e.screenY;
                });

                gameContainer.addEventListener('mouseup', (e) => {
                    if (mouseDown) {
                        mouseDown = false;
                        this.handleSwipe(mouseStartX, mouseStartY, e.screenX, e.screenY);
                    }
                });

                document.getElementById('new-game-btn').addEventListener('click', () => {
                    this.hideMessage();
                    this.init();
                });

                document.getElementById('try-again-btn').addEventListener('click', () => {
                    this.hideMessage();
                    this.init();
                });
            }

            handleSwipe(startX, startY, endX, endY) {
                const diffX = endX - startX;
                const diffY = endY - startY;
                const minSwipeDistance = 30; // 最小滑动距离

                if (Math.abs(diffX) < minSwipeDistance && Math.abs(diffY) < minSwipeDistance) {
                    return; // 滑动距离太短，忽略
                }

                if (Math.abs(diffX) > Math.abs(diffY)) {
                    // 水平滑动
                    if (diffX > 0) {
                        this.move('right');
                    } else {
                        this.move('left');
                    }
                } else {
                    // 垂直滑动
                    if (diffY > 0) {
                        this.move('down');
                    } else {
                        this.move('up');
                    }
                }
            }
        }

        // 启动游戏
        const game = new Game2048();
    </script>
    
    <!-- PWA 安装按钮 -->
    <div id="install-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000;">
        <div style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 10px; text-align: center;">
            <h3>📱 安装2048游戏</h3>
            <p>将游戏安装到手机主屏幕，随时畅玩！</p>
            <button id="install-btn" class="btn" style="margin: 10px;">立即安装</button>
            <button id="cancel-install" class="btn" style="background: #999;">稍后再说</button>
        </div>
    </div>
    
    <script>
        // PWA Service Worker 注册
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker 注册成功'))
                .catch(err => console.log('Service Worker 注册失败', err));
        }

        // PWA 安装提示
        let deferredPrompt;
        const installModal = document.getElementById('install-modal');
        const installBtn = document.getElementById('install-btn');
        const cancelBtn = document.getElementById('cancel-install');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // 显示安装提示（延迟3秒）
            setTimeout(() => {
                if (installModal) {
                    installModal.style.display = 'block';
                }
            }, 3000);
        });

        installBtn.addEventListener('click', () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then(choice => {
                    if (choice.outcome === 'accepted') {
                        console.log('用户接受安装');
                    }
                    deferredPrompt = null;
                });
            }
            installModal.style.display = 'none';
        });

        cancelBtn.addEventListener('click', () => {
            installModal.style.display = 'none';
        });

        // 检测是否已安装
        window.addEventListener('appinstalled', () => {
            console.log('应用已安装');
            installModal.style.display = 'none';
        });
    </script>
</body>
</html>
